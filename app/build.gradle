plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vadim129.rhythmoverlay'
    compileSdk 35

    defaultConfig {
        // This package name stays fixed so all future persistently-signed builds update in place.
        applicationId 'com.vadim129.rhythmoverlay'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2.0'
    }

    // The keystore is created once by the CI workflow and committed to app/signing. It is a
    // purpose-specific distribution key for this APK, not an Android debug key regenerated by a runner.
    signingConfigs {
        persistent {
            storeFile file('signing/rhythm-overlay.keystore')
            storePassword 'rhythm-overlay-persistent-2026'
            keyAlias 'rhythm-overlay'
            keyPassword 'rhythm-overlay-persistent-2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.persistent
        }
    }
}
