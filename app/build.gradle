plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.vadim.bookvoice'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.vadim.bookvoice'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Apache-2.0. PDFBox is used only on-device to extract PDF text for reading.
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
