# настройки для машин с малым объёмом памяти: сборка идёт медленнее, но не падает
org.gradle.jvmargs=-Xmx820m -XX:MaxMetaspaceSize=300m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.caching=false
android.useAndroidX=true
android.enableJetifier=false
