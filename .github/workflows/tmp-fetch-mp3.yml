# Временный workflow: скачать mp3 с acemusic.ai (песочница не имеет к нему доступа)
# и положить файл в текущую ветку, откуда его заберёт агент.
name: tmp-fetch-mp3

on:
  push:
    branches: [arena/1da48f5f-vadim129]
    paths: ['.github/workflows/tmp-fetch-mp3.yml']
  workflow_dispatch:
    inputs:
      url:
        description: 'URL файла'
        required: false
        default: 'https://acemusic.ai/data/so_acb27219a2644bdf852ea1d3.mp3'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1da48f5f-vadim129

      - name: Скачать mp3
        run: |
          URL="${{ github.event.inputs.url }}"
          [ -n "$URL" ] || URL="https://acemusic.ai/data/so_acb27219a2644bdf852ea1d3.mp3"
          curl -fSL --retry 3 --connect-timeout 20 -o song.mp3 "$URL"
          ls -la song.mp3
          file song.mp3

      - name: Положить в ветку
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f song.mp3
          git commit -q -m "tmp: скачанный mp3 [skip ci]" || echo "без изменений"
          git push -q origin HEAD:arena/1da48f5f-vadim129
