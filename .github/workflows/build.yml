name: Build BookVoice APK

on:
  push:
    branches: [ 'arena/8795e098-vadim129' ]
  workflow_dispatch:
    inputs:
      stage_for_drive:
        description: 'Temporarily stage the APK on this branch for Drive delivery'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: bookvoice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare named artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/BookVoice-1.0.0.apk
          sha256sum artifacts/BookVoice-1.0.0.apk > artifacts/BookVoice-1.0.0.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: bookvoice-apk
          if-no-files-found: error
          retention-days: 14
          path: artifacts/

      # Arena cannot reach the signed Azure artifact URL directly. This opt-in,
      # short-lived bridge lets the delivery agent retrieve the already-built APK
      # through the repository's authenticated Git transport, then it removes it.
      - name: Stage APK for Drive delivery
        if: github.event_name == 'workflow_dispatch' && inputs.stage_for_drive
        run: |
          mkdir -p .delivery
          cp artifacts/BookVoice-1.0.0.apk .delivery/BookVoice-1.0.0.apk
          cp artifacts/BookVoice-1.0.0.apk.sha256 .delivery/BookVoice-1.0.0.apk.sha256
          git config user.name "bookvoice-build[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .delivery/BookVoice-1.0.0.apk .delivery/BookVoice-1.0.0.apk.sha256
          git commit -m "build: stage APK for Drive delivery [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
