name: build
on:
  push:
    branches: [ 'arena/daaeaa56-vadim129', 'arena/f29f4753-vadim129' ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: stage
        run: |
          # на ветке агента стадия запускается только явным коммитом «ci-run: …»,
          # чтобы обычные пуши с кадрами не поднимали тяжёлые прогоны
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "arena/f29f4753-vadim129" ]; then
            if ! git log -1 --pretty=%s | grep -q '^ci-run:'; then
              echo "стадия не запрошена (нет ci-run: в сообщении коммита)"; exit 0
            fi
          fi
          bash ci/$(cat ci/stage.txt).sh || echo "stage script exit=$?"
      - name: diagnostics (annotations)
        if: always()
        run: |
          if [ -f out8/ошибка-push.txt ]; then echo "::error title=push-diag::$(head -c 600 out8/ошибка-push.txt | tr '\n' ' ')"; fi
          if [ -f out6/ошибка-push.txt ]; then echo "::error title=push-diag-6::$(head -c 600 out6/ошибка-push.txt | tr '\n' ' ')"; fi
          if [ -f orda/ошибка-push.txt ]; then echo "::error title=push-diag-orda::$(head -c 600 orda/ошибка-push.txt | tr '\n' ' ')"; fi
      - name: artifact с результатом
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-results
          if-no-files-found: warn
          retention-days: 14
          path: |
            out8/**
            out6/**
            out5/**
            orda/**
      - name: commit payload
        if: always()
        run: |
          git config user.email "ci@local"
          git config user.name "ci"
          git add -f payload
          git commit -m "ci: payload $(date -u +%H%M%S)" || echo "nothing to commit"
          git push || echo "payload push не прошёл"   # это не про клип, не валим задачу
