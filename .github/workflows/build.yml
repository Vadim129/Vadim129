name: build
on:
  push:
    branches: [ 'arena/daaeaa56-vadim129' ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: stage
        run: bash ci/$(cat ci/stage.txt).sh || echo "stage script exit=$?"
      - name: commit payload
        if: always()
        run: |
          git config user.email "ci@local"
          git config user.name "ci"
          git add -f payload
          git commit -m "ci: payload $(date -u +%H%M%S)" || echo "nothing to commit"
          git push || echo "payload push не прошёл"   # это не про клип, не валим задачу
