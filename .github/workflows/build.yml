name: build
on:
  push:
    branches: [ 'arena/daaeaa56-vadim129', 'arena/ebbb08ec-vadim129' ]
  workflow_dispatch:
    inputs:
      music_task:
        description: 'Optional isolated ACE-Step inference task'
        type: choice
        options: ['none', 'preview', 'full']
        default: 'none'
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[music-ai:') || contains(github.event.head_commit.message, '[mastering-apk]')) }}
jobs:
  build:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/arena/ebbb08ec-vadim129') && github.event.inputs.music_task != 'preview' && github.event.inputs.music_task != 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: stage
        run: bash ci/$(cat ci/stage.txt).sh || echo "stage script exit=$?"
      - name: diagnostics (annotations)
        if: always()
        run: |
          if [ -f out8/ошибка-push.txt ]; then echo "::error title=push-diag::$(head -c 600 out8/ошибка-push.txt | tr '\n' ' ')"; fi
          if [ -f out6/ошибка-push.txt ]; then echo "::error title=push-diag-6::$(head -c 600 out6/ошибка-push.txt | tr '\n' ' ')"; fi
      - name: artifact с результатом
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-results
          if-no-files-found: warn
          retention-days: 14
          path: |
            out8/**
            out6/**
            out5/**
      - name: commit payload
        if: always()
        run: |
          git config user.email "ci@local"
          git config user.name "ci"
          git add -f payload
          git commit -m "ci: payload $(date -u +%H%M%S)" || echo "nothing to commit"
          git push || echo "payload push не прошёл"   # это не про клип, не валим задачу

  music-model:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.music_task == 'preview' || inputs.music_task == 'full')) || (github.event_name == 'push' && github.ref == 'refs/heads/arena/ebbb08ec-vadim129' && contains(github.event.head_commit.message, '[music-ai:')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Public-key transfer setup
        run: |
          python -m pip install --quiet cryptography uv
          python music/ai_artifacts.py keygen runtime/worker_private.key runtime/offer/worker_public.key
          python -c "from pathlib import Path; print('::notice title=AI worker public key::'+Path('runtime/offer/worker_public.key').read_bytes().hex())"
      - name: Publish transfer offer
        run: |
          test "$GITHUB_REF_NAME" = 'arena/ebbb08ec-vadim129'
          cp runtime/offer/worker_public.key music/ai_worker_public.key
          git config user.email 'ci@local'
          git config user.name 'Music inference worker'
          git add music/ai_worker_public.key
          git commit -m "Publish ephemeral music worker public key"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Worker resources
        run: |
          free -h
          df -h .
          lscpu | head -25
      - name: CPU inference dependencies
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          uv pip install --system torch==2.10.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system 'transformers>=4.51,<4.58' 'diffusers>=0.37,<0.38' 'accelerate>=1.12' 'einops>=0.8' 'vector-quantize-pytorch>=1.27' loguru soundfile scipy numpy 'numba>=0.63' 'gradio==6.2.0' 'peft>=0.18' diskcache matplotlib 'pytorch-wavelets>=1.3' 'pywavelets>=1.9' 'setuptools<72' faster-whisper
      - name: Pinned upstream inference code
        run: |
          git clone --no-checkout https://github.com/ace-step/ACE-Step-1.5.git runtime/ace-step
          git -C runtime/ace-step checkout --detach ca1e85fe9430179831e6bc6be790c332190a3866
      - name: Receive encrypted source on current branch
        timeout-minutes: 16
        run: python music/ai_wait_source.py > runtime/transfer.log 2>&1
      - name: Real audio-conditioned music generation
        timeout-minutes: 60
        env:
          MUSIC_MODE: ${{ inputs.music_task || (contains(github.event.head_commit.message, '[music-ai:full]') && 'full' || 'preview') }}
        run: bash music/ai_run_job.sh
      - name: Preserve encrypted failure diagnostics
        if: always()
        run: |
          mkdir -p runtime/result
          python - <<'PY'
          import json
          from pathlib import Path
          status=Path('runtime/result/status.json')
          if not status.exists():
              p=Path('runtime/transfer.log')
              text=p.read_text(errors='replace') if p.exists() else 'No inference or transfer log was created'
              status.write_text(json.dumps({'exit_code':1,'diagnostic_tail':text[-12000:]},indent=2))
          PY
      - name: Encrypt result before artifact upload
        if: always()
        run: |
          if [ -d runtime/result ]; then
            python music/ai_artifacts.py archive runtime/result runtime/private-artifacts/music.encrypted --key music/ai_client_public.key
          fi
      - name: Return encrypted result on the same branch
        if: always()
        run: |
          if [ -f runtime/private-artifacts/music.encrypted ]; then
            test "$GITHUB_REF_NAME" = 'arena/ebbb08ec-vadim129'
            git pull --ff-only origin "$GITHUB_REF_NAME"
            cp runtime/private-artifacts/music.encrypted music/ai_output.encrypted
            git config user.email 'ci@local'
            git config user.name 'Music inference worker'
            git add music/ai_output.encrypted
            git commit -m "Return encrypted AI inference result"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

  mastering-apk:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/arena/ebbb08ec-vadim129' && contains(github.event.head_commit.message, '[mastering-apk]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify AI model and generate its checked configuration
        run: |
          python -m pip install --quiet numpy onnxruntime==1.20.1
          python ci/prepare-mastering-model.py
      - name: Build installable APK and run DSP tests
        id: apk
        run: bash ci/build-mastering.sh
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
      - name: Android UI, codec and actual on-device ONNX tests
        id: device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: bash ci/test-mastering-device.sh
      - name: Return APK and diagnostic results on the working branch
        if: always()
        env:
          APK_OUTCOME: ${{ steps.apk.outcome }}
          DEVICE_OUTCOME: ${{ steps.device.outcome }}
        run: |
          mkdir -p payload
          python - <<'PY'
          import json,os
          from pathlib import Path
          Path('payload/mastr-status.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'build':os.environ['APK_OUTCOME'],'device_tests':os.environ['DEVICE_OUTCOME']},indent=2)+'\n')
          PY
          test "$GITHUB_REF_NAME" = 'arena/ebbb08ec-vadim129'
          git pull --ff-only origin "$GITHUB_REF_NAME"
          git config user.email 'ci@local'
          git config user.name 'Android build worker'
          git add mastering-app/app/src/main/assets/model_info.json
          git add -f payload/mastr-*
          git commit -m "Return MASTR APK build and test results"
          git push origin "HEAD:$GITHUB_REF_NAME"

  android-signing-tools:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/arena/ebbb08ec-vadim129' && contains(github.event.head_commit.message, '[signing-tools]') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve official Android SDK signing verifier
        run: |
          set -euo pipefail
          tool=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -n "$tool"
          mkdir -p payload
          cp "$tool" payload/android-apksigner.jar
          java -jar payload/android-apksigner.jar version > payload/android-apksigner-version.txt
          sha256sum payload/android-apksigner.jar > payload/android-apksigner-sha256.txt
          git config user.email 'ci@local'
          git config user.name 'Android signing tools worker'
          git add -f payload/android-apksigner.jar payload/android-apksigner-version.txt payload/android-apksigner-sha256.txt
          git commit -m 'Return official Android SDK APK signing verifier'
          git push origin HEAD:arena/ebbb08ec-vadim129
