name: Build BookVoice APK

on:
  push:
    branches: [ 'arena/8795e098-vadim129' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookvoice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare named artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/BookVoice-1.0.0.apk
          sha256sum artifacts/BookVoice-1.0.0.apk > artifacts/BookVoice-1.0.0.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bookvoice-apk
          if-no-files-found: error
          retention-days: 14
          path: artifacts/
