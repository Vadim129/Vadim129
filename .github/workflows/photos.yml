name: photos-to-drive

on:
  push:
    branches: [ 'arena/08e16207-vadim129' ]
    paths:
      - 'fix/drive_manifest.tsv'
      - 'fix/upload_photos.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photos-drive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: upload photos
        run: |
          set -o pipefail
          python3 -u fix/upload_photos.py fix/drive_manifest.tsv 2>&1 | tee /tmp/log.txt

      - name: report
        if: always()
        run: |
          mkdir -p fix/reports
          cp /tmp/log.txt fix/reports/photos_upload.txt || true
          git config user.email "ci@local"
          git config user.name "ci"
          git add -f fix/reports
          git commit -q -m "photos: отчёт выгрузки кадров в Drive" || { echo "нечего коммитить"; exit 0; }
          for i in 1 2 3 4 5; do
            if git push; then echo "push ок"; exit 0; fi
            git pull --rebase --autostash --no-edit -q || git rebase --abort || true
            sleep 5
          done
          exit 1
