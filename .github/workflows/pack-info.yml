name: Pack info (сколько стикеров на самом деле)
on:
  workflow_dispatch:
  push:
    branches: [arena/1d4df997-vadim129]
    paths:
      - "deepstick-bot/tools/pack_info.py"
      - ".github/workflows/pack-info.yml"

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python deepstick-bot/tools/pack_info.py ixVadim ixVadim_alive_by_Stikerrebot
