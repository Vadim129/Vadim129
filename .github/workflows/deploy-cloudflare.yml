name: Deploy DeepStick to Cloudflare

# Деплой бота в Cloudflare Containers (нужен тариф Workers Paid).
# Требуемые секреты репозитория (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   — токен из dash.cloudflare.com/profile/api-tokens
#   CLOUDFLARE_ACCOUNT_ID  — Account ID со страницы Workers & Pages
#   BOT_TOKEN              — токен бота от @BotFather
# Запуск: Actions -> этот workflow -> Run workflow (или скажи ассистенту «готово»).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: deepstick-bot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_BOT_TOKEN: ${{ secrets.BOT_TOKEN != '' }}
        run: |
          missing=""
          [ "$HAS_CF_TOKEN" = "true" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ "$HAS_CF_ACCOUNT" = "true" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ "$HAS_BOT_TOKEN" = "true" ] || missing="$missing BOT_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты репозитория:$missing"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Зависимости воркера
        run: npm install --no-audit --no-fund

      - name: Первый деплой (создаёт воркер и образ контейнера)
        run: npx wrangler deploy

      - name: Секрет BOT_TOKEN в воркер
        env:
          BOT_TOKEN_VALUE: ${{ secrets.BOT_TOKEN }}
        run: printf %s "$BOT_TOKEN_VALUE" | npx wrangler secret put BOT_TOKEN

      - name: Финальный деплой (контейнер стартует уже с токеном)
        run: npx wrangler deploy

      - name: Разбудить контейнер и проверить healthcheck
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['result']['subdomain'])")
          URL="https://deepstick-bot.$SUB.workers.dev/health"
          echo "::notice::Ссылка на воркер (healthcheck бота): $URL"
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.txt -w "%{http_code}" "$URL" || true)
            echo "попытка $i: HTTP $code"; cat /tmp/health.txt || true; echo
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Контейнер не ответил 200 за ~10 минут — смотри логи: npx wrangler tail"
          exit 1
