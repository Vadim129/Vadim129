name: APK inspection transfer
on:
  push:
    branches: [arena/a8eed22a-vadim129]
jobs:
  transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Transfer release file to temporary Git objects
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download apk-analysis --repo "$REPO" --pattern '1.0.6.apk' --dir "$RUNNER_TEMP"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / '1.0.6.apk'
          repo = os.environ['REPO']
          parts = []
          with path.open('rb') as f:
              while data := f.read(19_000_000):
                  payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
                  result = subprocess.run(['gh', 'api', '--method', 'POST', f'/repos/{repo}/git/blobs', '--input', '-'], input=payload, text=True, capture_output=True, check=True)
                  parts.append(json.loads(result.stdout)['sha'])
                  print('Uploaded part', len(parts), flush=True)
          manifest = json.dumps({'parts': parts, 'size': path.stat().st_size, 'sha256': hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()})
          result = subprocess.run(['gh', 'api', '--method', 'POST', f'/repos/{repo}/git/blobs', '-f', 'content='+manifest], capture_output=True, text=True, check=True)
          sha = json.loads(result.stdout)['sha']
          subprocess.run(['gh', 'api', '--method', 'POST', f"/repos/{repo}/statuses/{os.environ['COMMIT']}", '-f', 'state=success', '-f', 'context=apk-inspection-transfer', '-f', 'description='+sha], check=True)
          PY
