name: DeepStick Bot (запуск)

# Временный хостинг бота на раннере GitHub Actions: один запуск живёт ~5.5 часов.
# С chain=true бот сам перезапускает себя перед выключением раннера и живёт,
# пока не отключишь workflow (вкладка Actions) или не отменишь запуск.
# Для постоянной работы на своём сервере лучше Docker: deepstick-bot/README.md.

on:
  push:
    branches: ["arena/1d4df997-vadim129"]
    paths:
      - "deepstick-bot/**"
      - ".github/workflows/deepstick-bot.yml"
  workflow_dispatch:
    inputs:
      chain:
        description: "Перезапускать себя перед выключением раннера"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: deepstick-bot
  # Новый пуш = новый код бота: старый запуск отменяется и бот сразу обновляется,
  # а не ждёт очереди часами. Цепочка перезапусков при этом не ломается:
  # следующий запуск диспатчится только после завершения текущего.
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deepstick-bot/requirements-rembg.txt

      - name: ffmpeg + зависимости
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r deepstick-bot/requirements-rembg.txt

      # История/настройки/последние фото переживают перезапуск раннера через cache.
      # Стикерпак при этом вообще в Telegram хранится — он не теряется в любом случае.
      - name: Восстановить данные бота
        uses: actions/cache/restore@v4
        with:
          path: |
            deepstick-bot/data
            ~/.u2net
            ~/.rembg
          key: deepstick-data-${{ github.run_id }}
          restore-keys: deepstick-data-

      # Диагностика без раскрытия секрета: виден ли токен и принимает ли его Telegram.
      # По тому, какой шаг красный, причина понятна даже без доступа к логам.
      - name: Диагностика — секрет задан?
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error title=Секрет не виден::BOT_TOKEN пуст. Секрет должен быть именно Repository secret во вкладке Actions (Settings -> Secrets and variables -> Actions), имя — BOT_TOKEN."
            exit 1
          fi
          echo "BOT_TOKEN задан (длина: ${#BOT_TOKEN})"

      - name: Диагностика — токен принимает Telegram?
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          resp=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getMe")
          echo "$resp" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if not d.get('ok'):
              print('::error title=Токен отклонён::Telegram не принял BOT_TOKEN:', d.get('description'))
              sys.exit(1)
          r = d['result']
          print(f\"::notice title=Бот онлайн::@{r.get('username')} ({r.get('first_name')})\")"

      - name: Бот (поллинг Telegram)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          # Бесплатная image-to-video нейросеть (движения персонажа, Wan 2.1).
          # При недоступности/лимитах спейса бот сам откатывается на локальную анимацию.
          AI_PROVIDER: hf
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TOKENS: ${{ secrets.HF_TOKENS }}
          REMOVE_BG: auto
          DATA_DIR: data
        run: |
          cd deepstick-bot
          # 124 = timeout 5.5 ч (норма, ниже перезапуск). Любой другой код = краш:
          # валим задачу, чтобы цепочка перезапуска не крутилась вхолостую.
          timeout 19800 python bot.py; code=$?
          if [ $code -ne 124 ]; then exit $code; fi

      - name: Подготовить папки данных
        if: always()
        run: mkdir -p deepstick-bot/data ~/.u2net ~/.rembg

      - name: Сохранить данные бота
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            deepstick-bot/data
            ~/.u2net
            ~/.rembg
          key: deepstick-data-${{ github.run_id }}

      - name: Перезапустить себя
        if: ${{ github.event_name == 'push' || inputs.chain }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deepstick-bot.yml --ref "$GITHUB_REF_NAME" -f chain=true
