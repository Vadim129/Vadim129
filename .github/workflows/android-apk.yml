name: Build Rhythm Overlay APK

on:
  push:
    branches:
      - arena/f567ee77-vadim129
    paths-ignore:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -n "${ANDROID_HOME}"
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" || test -x "${ANDROID_HOME}/tools/bin/sdkmanager" || true
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Build signed debug APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleDebug
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/RhythmOverlay-v1.0.0.apk
          sha256sum release/RhythmOverlay-v1.0.0.apk > release/RhythmOverlay-v1.0.0.apk.sha256

      # Keeping the requested installable file on this exact Arena branch makes it retrievable
      # even when a short-lived Actions artifact has expired.
      - name: Commit build output to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Arena APK Builder"
          git config user.email "arena-apk-builder@users.noreply.github.com"
          git add -f release/RhythmOverlay-v1.0.0.apk release/RhythmOverlay-v1.0.0.apk.sha256
          git commit -m "build: Rhythm Overlay APK v1.0.0" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
