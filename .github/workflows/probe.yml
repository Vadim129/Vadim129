name: Пробник новых видео

on:
  push:
    branches:
      - 'arena/7213a08a-vadim129'
    paths:
      - 'griby/tools/probe_new.py'
      - '.github/workflows/probe.yml'
      - 'ci/probe/go'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: зависимости
        run: |
          python -m pip install -q --upgrade pip
          pip install -q pillow gdown

      - name: кадры из новых видео
        run: python3 griby/tools/probe_new.py

      - name: опубликовать кадры
        run: |
          git config user.name "ci-bot"; git config user.email "ci@bot.local"
          for i in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --mixed FETCH_HEAD
            git checkout FETCH_HEAD -- ci 2>/dev/null || true
            git add -f ci/probe
            git commit -q -m "ci: кадры новых видео ($GITHUB_RUN_ID) [skip ci]" || true
            git push -q origin HEAD:${GITHUB_REF_NAME} && break
            sleep 3
          done
