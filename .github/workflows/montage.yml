name: Монтаж нового клипа

on:
  push:
    branches:
      - 'arena/7213a08a-vadim129'
    paths:
      - 'griby/tools/build_montage3.py'
      - '.github/workflows/montage.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: montage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          df -h / | tail -1

      - name: gdown
        run: |
          python -m pip install -q --upgrade pip
          pip install -q gdown

      - name: сборка
        env:
          OUTDIR: ${{ github.workspace }}/out
        run: |
          mkdir -p "$OUTDIR"
          rm -f dist/clip/*
          python3 -u griby/tools/build_montage3.py > build.log 2>&1 || { tail -30 build.log; exit 1; }
          tail -8 build.log
          ls -lh "$OUTDIR"

      - name: кадры
        if: always()
        run: |
          mkdir -p ci/mont3
          rm -f ci/mont3/*.jpg
          cp build.log ci/mont3/build.log 2>/dev/null || true
          if [ -f "out/КЛИП_Грибы_1080p_сюжет.mp4" ]; then
            ffprobe -v error -show_entries format=duration,size -of default=nw=1 "out/КЛИП_Грибы_1080p_сюжет.mp4" > ci/mont3/info.txt || true
            for t in 2 12 22 32 45 55 65 75 85 95 105 115 125 135 143 150 160 170 180 190 200 210 220 232 242 247; do
              ffmpeg -v error -y -ss $t -i "out/КЛИП_Грибы_1080p_сюжет.mp4" \
                -frames:v 1 -vf scale=320:-2 -q:v 5 "ci/mont3/t${t}.jpg" || true
            done
          fi
          ls -l ci/mont3 | head -40

      - name: нарезать полную версию
        if: always()
        run: |
          mkdir -p ci/mont3/master
          rm -f ci/mont3/master/part_*
          if [ -f "out/КЛИП_Грибы_1080p_сюжет.mp4" ]; then
            split -b 60M -d -a 2 "out/КЛИП_Грибы_1080p_сюжет.mp4" ci/mont3/master/part_
            sha256sum "out/КЛИП_Грибы_1080p_сюжет.mp4" | cut -d' ' -f1 > ci/mont3/master/sha256.txt
            cat ci/mont3/master/sha256.txt
          fi

      - name: опубликовать
        if: always()
        run: |
          git config user.name "ci-bot"; git config user.email "ci@bot.local"
          mkdir -p dist/clip
          cp "out/КЛИП_Грибы_1080p_сюжет_диск.mp4" "dist/clip/КЛИП_Грибы_1080p_сюжет.mp4" 2>/dev/null || true
          ls -lh dist/clip || true
          rm -rf /tmp/fresh && mkdir -p /tmp/fresh
          cp -r ci/mont3 /tmp/fresh/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --mixed FETCH_HEAD
            mkdir -p ci && rm -rf ci/mont3 && cp -r /tmp/fresh/mont3 ci/mont3 2>/dev/null || true
            cp "out/КЛИП_Грибы_1080p_сюжет_диск.mp4" "dist/clip/КЛИП_Грибы_1080p_сюжет.mp4" 2>/dev/null || true
            cp build.log ci/mont3/build.log 2>/dev/null || true
            git add -f ci/mont3 dist/clip
            git commit -q -m "dist: клип по сюжету песни ($GITHUB_RUN_ID) [skip ci]" --allow-empty || true
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then echo PUSHED; break; fi
            sleep 5
          done
