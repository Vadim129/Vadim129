name: Монтаж нового клипа

on:
  push:
    branches:
      - 'arena/7213a08a-vadim129'
    paths:
      - 'griby/tools/build_montage.py'
      - '.github/workflows/montage.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: montage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: gdown
        run: |
          python -m pip install -q --upgrade pip
          pip install -q gdown

      - name: сборка
        env:
          OUTDIR: ${{ github.workspace }}/out
        run: |
          mkdir -p "$OUTDIR"
          python3 -u griby/tools/build_montage.py > build.log 2>&1 || { tail -25 build.log; exit 1; }
          tail -12 build.log
          ls -lh "$OUTDIR"

      - name: кадры и лог
        if: always()
        run: |
          mkdir -p ci/mont
          rm -f ci/mont/*.jpg
          cp build.log ci/mont/build.log 2>/dev/null || true
          if [ -f "out/КЛИП_Грибы_1080p_новый.mp4" ]; then
            ffprobe -v error -show_entries format=duration -of csv=p=0 "out/КЛИП_Грибы_1080p_новый.mp4" > ci/mont/duration.txt || true
            for t in 3 15 35 65 75 95 115 135 155 175 195 205 225 240 247; do
              ffmpeg -v error -y -ss $t -i "out/КЛИП_Грибы_1080p_новый.mp4" \
                -frames:v 1 -vf scale=320:-2 -q:v 5 "ci/mont/t${t}.jpg" || true
            done
          fi
          ls -l ci/mont | head -30

      - name: выложить
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@bot.local"
          mkdir -p dist/clip
          cp "out/КЛИП_Грибы_1080p_новый.mp4" "dist/clip/КЛИП_Грибы_1080p_новый.mp4" 2>/dev/null || true
          rm -f ci/mont/*.mp4
          git add -f ci/mont dist/clip
          git commit -q -m "dist: новый клип из листов + кадры ($GITHUB_RUN_ID) [skip ci]" || true
          for i in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git rebase -q -X theirs FETCH_HEAD || git rebase --abort
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep 6
          done
          echo "push не прошёл"; exit 1
