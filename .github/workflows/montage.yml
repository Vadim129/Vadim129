name: montage
on:
  push:
    branches: [ 'arena/08e16207-vadim129' ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: montage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        task: [step2, step3a, step3b]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -version | head -1
      - name: cache source video
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/montage-src.mp4
            /home/runner/montage-audio.wav
          key: montage-src-14w459uIJuDZTB5A7fj2E54gS3tOPLLhJ
      - name: cache python
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/pip
            /home/runner/.cache/huggingface
          key: montage-py-v4
      - name: task
        continue-on-error: true
        timeout-minutes: 40
        run: bash montage/${{ matrix.task }}.sh
